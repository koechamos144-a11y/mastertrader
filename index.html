<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeDesk · Realistic Trading UI</title>
    <!-- Font Awesome Icons (for clean icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ----- RESET & GLOBAL ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        /* ----- DASHBOARD CONTAINER ----- */
        .dashboard {
            max-width: 1440px;
            width: 100%;
            background-color: #0b0e14;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.02);
            padding: 1.75rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }

        /* ----- TYPOGRAPHY & COLORS (consistent) ----- */
        :root {
            --bg-dark: #0b0e14;
            --panel-bg: #131820;
            --panel-lighter: #1a212b;
            --border-subtle: #232b38;
            --text-primary: #f0f4fa;
            --text-secondary: #8e9bb0;
            --accent-green: #00c48c;
            --accent-red: #f6465d;
            --accent-blue: #2f7cf6;
            --accent-gold: #f0b90b;
            --shadow-glow: 0 0 15px rgba(0, 196, 140, 0.1);
        }

        .text-green {
            color: var(--accent-green);
        }
        .text-red {
            color: var(--accent-red);
        }
        .text-gold {
            color: var(--accent-gold);
        }

        /* ----- HEADER / TOP NAV ----- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            background: linear-gradient(145deg, #1e2a3a, #0f141c);
            border-radius: 12px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #2b3748;
            color: var(--accent-green);
            font-size: 1.5rem;
        }

        .logo-text {
            font-weight: 600;
            font-size: 1.3rem;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .logo-text span {
            color: var(--accent-green);
        }

        /* ----- SEARCH & USER ----- */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .search-box {
            background-color: var(--panel-bg);
            border-radius: 30px;
            padding: 0.5rem 1rem 0.5rem 1.25rem;
            display: flex;
            align-items: center;
            border: 1px solid var(--border-subtle);
            transition: all 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(47, 124, 246, 0.15);
        }

        .search-box i {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-right: 0.6rem;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.9rem;
            width: 200px;
            font-weight: 400;
        }

        .search-box input::placeholder {
            color: #5e6b7e;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-profile .balance {
            background-color: var(--panel-bg);
            padding: 0.5rem 1rem;
            border-radius: 30px;
            border: 1px solid var(--border-subtle);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .user-profile .balance i {
            color: var(--accent-gold);
            margin-right: 0.4rem;
        }

        .avatar {
            background: linear-gradient(145deg, #1e2a3a, #0f141c);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #2b3748;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: border 0.2s;
        }

        .avatar:hover {
            border-color: var(--accent-green);
        }

        /* ----- STATS ROW (KEY METRICS) ----- */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
        }

        .stat-card {
            background-color: var(--panel-bg);
            border-radius: 1.25rem;
            padding: 1.25rem 1.5rem;
            border: 1px solid var(--border-subtle);
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .stat-card:hover {
            border-color: #2e3a4b;
            background-color: #151c26;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 1.7rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .stat-change {
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        /* ----- MAIN GRID: CHART + WATCHLIST / ORDER ----- */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 1.5rem;
        }

        /* ----- CHART PANEL ----- */
        .chart-panel {
            background-color: var(--panel-bg);
            border-radius: 1.5rem;
            border: 1px solid var(--border-subtle);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .chart-title h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .pair-badge {
            background-color: #1e293b;
            padding: 0.25rem 0.75rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            border: 1px solid #2a3442;
        }

        .chart-tabs {
            display: flex;
            gap: 0.5rem;
            background-color: #0f141c;
            padding: 0.25rem;
            border-radius: 40px;
            border: 1px solid #212a36;
        }

        .chart-tab {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.8rem;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .chart-tab.active {
            background-color: #1e2a3a;
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .chart-area {
            position: relative;
            height: 240px;
            width: 100%;
            background: #0e131b;
            border-radius: 1rem;
            padding: 0.5rem;
            border: 1px solid #1d2532;
            overflow: hidden;
        }

        .chart-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .chart-footer {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 0.75rem;
            padding: 0 0.25rem;
        }

        /* ----- WATCHLIST PANEL (right side) ----- */
        .watchlist-panel {
            background-color: var(--panel-bg);
            border-radius: 1.5rem;
            border: 1px solid var(--border-subtle);
            padding: 1.5rem 0 0.5rem 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1.25rem 0.75rem 1.25rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .panel-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .panel-header a {
            color: var(--accent-blue);
            font-size: 0.75rem;
            text-decoration: none;
            font-weight: 500;
        }

        .watchlist-items {
            display: flex;
            flex-direction: column;
            max-height: 300px;
            overflow-y: auto;
            padding: 0 0.25rem;
        }

        .watchlist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1rem;
            border-radius: 0.75rem;
            margin: 0 0.5rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .watchlist-item:hover {
            background-color: #1a212b;
        }

        .coin-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .coin-icon {
            width: 32px;
            height: 32px;
            background: #1e293b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--accent-gold);
            border: 1px solid #2e3b4b;
        }

        .coin-name {
            font-weight: 500;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .coin-symbol {
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .coin-price {
            text-align: right;
        }

        .price-value {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .price-change {
            font-size: 0.7rem;
            font-weight: 500;
        }

        /* ----- ORDER PANEL (bottom of right column) ----- */
        .order-panel {
            background-color: var(--panel-bg);
            border-radius: 1.5rem;
            border: 1px solid var(--border-subtle);
            padding: 1.25rem 1.5rem 1.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 0.25rem;
        }

        .order-tabs {
            display: flex;
            gap: 0.5rem;
            background: #0f141c;
            border-radius: 40px;
            padding: 0.25rem;
            border: 1px solid #212a36;
        }

        .order-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.8rem;
            padding: 0.5rem 0;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .order-tab.active-buy {
            background-color: var(--accent-green);
            color: #0b0e14;
        }

        .order-tab.active-sell {
            background-color: var(--accent-red);
            color: white;
        }

        .order-input-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .order-input-group label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .order-input-wrapper {
            background: #0f141c;
            border-radius: 0.75rem;
            border: 1px solid var(--border-subtle);
            padding: 0.6rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .order-input-wrapper input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.95rem;
            width: 100%;
        }

        .order-input-wrapper span {
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 500;
        }

        .order-summary {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
            padding: 0.25rem 0;
        }

        .order-btn {
            background-color: var(--accent-green);
            border: none;
            border-radius: 0.9rem;
            padding: 0.9rem;
            font-weight: 700;
            font-size: 0.95rem;
            color: #0b0e14;
            cursor: pointer;
            transition: all 0.15s;
            margin-top: 0.25rem;
            letter-spacing: 0.3px;
        }

        .order-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .order-btn.sell {
            background-color: var(--accent-red);
            color: white;
        }

        /* ----- SCROLLBAR (subtle) ----- */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #2e3a4b;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #3e4d62;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .dashboard {
                padding: 1.25rem;
            }

            .search-box input {
                width: 120px;
            }
        }

        @media (max-width: 600px) {
            .stats-row {
                grid-template-columns: 1fr 1fr;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .header-actions {
                justify-content: space-between;
            }

            .search-box input {
                width: 100%;
            }

            .search-box {
                flex: 1;
            }
        }

        /* small animations */
        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- ========== HEADER ========== -->
        <header class="header">
            <div class="logo-area">
                <div class="logo-icon">
                    <i class="fas fa-chart-line"></i>
                </div>
                <div class="logo-text">Trade<span>Desk</span></div>
            </div>
            <div class="header-actions">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search markets...">
                </div>
                <div class="user-profile">
                    <div class="balance">
                        <i class="fas fa-wallet"></i> $24,562.80
                    </div>
                    <div class="avatar">JD</div>
                </div>
            </div>
        </header>

        <!-- ========== STATS ROW ========== -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label">Total Balance</div>
                <div class="stat-value">$24,562.80</div>
                <div class="stat-change text-green"><i class="fas fa-arrow-up"></i> +3.2%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Today's P&L</div>
                <div class="stat-value text-green">+$1,245.30</div>
                <div class="stat-change text-green"><i class="fas fa-arrow-up"></i> +5.1%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Margin Used</div>
                <div class="stat-value">$8,430.20</div>
                <div class="stat-change text-red"><i class="fas fa-arrow-down"></i> 34.3%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Open Positions</div>
                <div class="stat-value">3</div>
                <div class="stat-change text-secondary" style="color: var(--text-secondary);">2 long · 1 short</div>
            </div>
        </div>

        <!-- ========== MAIN GRID ========== -->
        <div class="main-grid">
            <!-- LEFT: CHART + WATCHLIST (but watchlist is on right) Actually chart on left, watchlist on right -->
            <div class="chart-panel">
                <div class="chart-header">
                    <div class="chart-title">
                        <h3>BTC / USDT</h3>
                        <span class="pair-badge">Bitcoin</span>
                    </div>
                    <div class="chart-tabs">
                        <button class="chart-tab">1H</button>
                        <button class="chart-tab active">1D</button>
                        <button class="chart-tab">1W</button>
                        <button class="chart-tab">1M</button>
                    </div>
                </div>

                <!-- CHARTPLACE SVG (realistic candlestick-like shape) -->
                <div class="chart-area">
                    <svg class="chart-svg" viewBox="0 0 600 200" preserveAspectRatio="none">
                        <!-- grid lines -->
                        <line x1="0" y1="40" x2="600" y2="40" stroke="#1d2532" stroke-width="0.5" />
                        <line x1="0" y1="80" x2="600" y2="80" stroke="#1d2532" stroke-width="0.5" />
                        <line x1="0" y1="120" x2="600" y2="120" stroke="#1d2532" stroke-width="0.5" />
                        <line x1="0" y1="160" x2="600" y2="160" stroke="#1d2532" stroke-width="0.5" />
                        <!-- area fill -->
                        <path d="M0,150 L40,140 L80,130 L120,90 L160,100 L200,70 L240,80 L280,55 L320,60 L360,40 L400,45 L440,30 L480,35 L520,25 L560,20 L600,10 L600,200 L0,200 Z" 
                              fill="url(#gradient)" opacity="0.15" />
                        <!-- main line -->
                        <polyline points="0,150 40,140 80,130 120,90 160,100 200,70 240,80 280,55 320,60 360,40 400,45 440,30 480,35 520,25 560,20 600,10" 
                                  fill="none" stroke="#00c48c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
                        <!-- dots (simulating data points) -->
                        <circle cx="0" cy="150" r="2.5" fill="#00c48c" />
                        <circle cx="80" cy="130" r="2.5" fill="#00c48c" />
                        <circle cx="160" cy="100" r="2.5" fill="#00c48c" />
                        <circle cx="240" cy="80" r="2.5" fill="#00c48c" />
                        <circle cx="320" cy="60" r="2.5" fill="#00c48c" />
                        <circle cx="400" cy="45" r="2.5" fill="#00c48c" />
                        <circle cx="480" cy="35" r="2.5" fill="#00c48c" />
                        <circle cx="560" cy="20" r="2.5" fill="#00c48c" />
                        <!-- gradient def -->
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#00c48c" stop-opacity="0.5" />
                                <stop offset="100%" stop-color="#00c48c" stop-opacity="0" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="chart-footer">
                    <span>24h Vol: $2.1B</span>
                    <span>High: $64,280</span>
                    <span>Low: $62,150</span>
                    <span class="text-green"><i class="fas fa-caret-up"></i> +2.34%</span>
                </div>
            </div>

            <!-- RIGHT: WATCHLIST + ORDER (stacked) -->
            <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                <!-- WATCHLIST -->
                <div class="watchlist-panel">
                    <div class="panel-header">
                        <h3><i class="fas fa-star" style="color: var(--accent-gold); margin-right: 6px;"></i>Watchlist</h3>
                        <a href="#">View all</a>
                    </div>
                    <div class="watchlist-items" id="watchlistContainer">
                        <!-- populated by JS -->
                    </div>
                </div>

                <!-- ORDER PANEL -->
                <div class="order-panel">
                    <div class="order-tabs">
                        <button class="order-tab active-buy" id="buyTab">Buy</button>
                        <button class="order-tab" id="sellTab">Sell</button>
                    </div>

                    <div class="order-input-group">
                        <label>Price (USDT)</label>
                        <div class="order-input-wrapper">
                            <input type="text" value="63,250.50" id="priceInput">
                            <span>USDT</span>
                        </div>
                    </div>

                    <div class="order-input-group">
                        <label>Amount (BTC)</label>
                        <div class="order-input-wrapper">
                            <input type="text" value="0.025" id="amountInput">
                            <span>BTC</span>
                        </div>
                    </div>

                    <div class="order-summary">
                        <span>Total</span>
                        <span style="color: var(--text-primary); font-weight: 600;" id="totalDisplay">$1,581.26</span>
                    </div>

                    <button class="order-btn" id="orderActionBtn">Buy BTC</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== JAVASCRIPT ========== -->
    <script>
        (function() {
            // ---------- WATCHLIST DATA (realistic crypto pairs) ----------
            const watchlistData = [
                { name: 'Bitcoin', symbol: 'BTC', price: 63250.50, change: 2.34, icon: '₿' },
                { name: 'Ethereum', symbol: 'ETH', price: 3456.20, change: 1.87, icon: 'Ξ' },
                { name: 'Solana', symbol: 'SOL', price: 142.75, change: -0.56, icon: '◎' },
                { name: 'Cardano', symbol: 'ADA', price: 0.625, change: 5.23, icon: '₳' },
                { name: 'Polkadot', symbol: 'DOT', price: 8.92, change: -1.12, icon: '●' },
                { name: 'Ripple', symbol: 'XRP', price: 0.584, change: 3.45, icon: '✕' }
            ];

            const watchlistContainer = document.getElementById('watchlistContainer');

            function renderWatchlist() {
                if (!watchlistContainer) return;
                watchlistContainer.innerHTML = watchlistData.map(item => {
                    const changeClass = item.change >= 0 ? 'text-green' : 'text-red';
                    const arrow = item.change >= 0 ? '▲' : '▼';
                    return `
                        <div class="watchlist-item">
                            <div class="coin-info">
                                <div class="coin-icon">${item.icon}</div>
                                <div>
                                    <div class="coin-name">${item.name}</div>
                                    <div class="coin-symbol">${item.symbol}/USDT</div>
                                </div>
                            </div>
                            <div class="coin-price">
                                <div class="price-value">$${item.price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                                <div class="price-change ${changeClass}">${arrow} ${Math.abs(item.change).toFixed(2)}%</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // ---------- ORDER PANEL DYNAMICS ----------
            const buyTab = document.getElementById('buyTab');
            const sellTab = document.getElementById('sellTab');
            const orderActionBtn = document.getElementById('orderActionBtn');
            const priceInput = document.getElementById('priceInput');
            const amountInput = document.getElementById('amountInput');
            const totalDisplay = document.getElementById('totalDisplay');

            let isBuy = true; // buy state

            function setOrderSide(side) {
                if (side === 'buy') {
                    isBuy = true;
                    buyTab.classList.add('active-buy');
                    sellTab.classList.remove('active-sell');
                    orderActionBtn.textContent = 'Buy BTC';
                    orderActionBtn.classList.remove('sell');
                } else {
                    isBuy = false;
                    sellTab.classList.add('active-sell');
                    buyTab.classList.remove('active-buy');
                    orderActionBtn.textContent = 'Sell BTC';
                    orderActionBtn.classList.add('sell');
                }
                updateTotal();
            }

            // Update total based on price * amount
            function updateTotal() {
                const price = parseFloat(priceInput.value.replace(/,/g, '')) || 0;
                const amount = parseFloat(amountInput.value) || 0;
                const total = price * amount;
                totalDisplay.textContent = '$' + total.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }

            // Event listeners for tabs
            if (buyTab && sellTab) {
                buyTab.addEventListener('click', () => setOrderSide('buy'));
                sellTab.addEventListener('click', () => setOrderSide('sell'));
            }

            // Update total on input changes
            if (priceInput && amountInput) {
                priceInput.addEventListener('input', updateTotal);
                amountInput.addEventListener('input', updateTotal);
            }

            // Order button click (simulate)
            if (orderActionBtn) {
                orderActionBtn.addEventListener('click', () => {
                    const action = isBuy ? 'Buy' : 'Sell';
                    const amount = amountInput.value || '0';
                    alert(`✅ ${action} order placed for ${amount} BTC at $${priceInput.value}`);
                });
            }

            // ---------- CHART TAB SWITCHING (visual only) ----------
            const chartTabs = document.querySelectorAll('.chart-tab');
            chartTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    chartTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                });
            });

            // ---------- ADD REALISTIC HOVER GLOW TO STAT CARDS (just for fun) ----------
            const statCards = document.querySelectorAll('.stat-card');
            statCards.forEach(card => {
                card.addEventListener('mouseenter', () => {
                    card.style.boxShadow = '0 0 0 1px rgba(0, 196, 140, 0.2)';
                });
                card.addEventListener('mouseleave', () => {
                    card.style.boxShadow = 'none';
                });
            });

            // ---------- INIT ----------
            renderWatchlist();
            // Set initial total
            updateTotal();

            // Format price input with commas on load (already has static value)
            // But we want to ensure the total matches
            // Also if user edits, we strip commas in parse.
            // Optional: Add comma formatting as user types (lightweight)
            priceInput.addEventListener('blur', function() {
                let val = this.value.replace(/,/g, '');
                if (!isNaN(parseFloat(val))) {
                    this.value = parseFloat(val).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                }
                updateTotal();
            });

            amountInput.addEventListener('blur', function() {
                let val = this.value.replace(/,/g, '');
                if (!isNaN(parseFloat(val))) {
                    this.value = parseFloat(val).toFixed(4);
                }
                updateTotal();
            });

            // Make sure that when price input changes, we update immediately as well
            // (already added listener)
        })();
    </script>
</body>
</html>
